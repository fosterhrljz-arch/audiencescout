 {title:`A practical guide to ${s.job.replace(/\.$/,'').toLowerCase()}`,format:'Task walkthrough',angle:s.painPoints,proof:'Use a real demonstration, clearly labeled example, or verified interview detail. Do not claim typical results.',cta:'Invite the reader to describe their current approach.',channel:s.routes.includes('video')?'Practical demonstration videos':'Problem-led search content'},

function knownSegment(id){return /^(fitness|finance|inventory|food|education|software|service|custom|institution)-[a-z]+$/.test(id)&&((Object.entries(R.PROFILES).some(([domain,rows])=>rows.some(r=>`${domain}-${r.id}`===id)))||['software','service','custom','finance','fitness','inventory'].some(domain=>['owner','operator','approver','transition','expansion','first','recurring','switch','occasion','support'].some(key=>id===`${domain}-${key}`))||['sponsor','coordinator','participant','reviewer','renewal'].some(key=>id===`institution-${key}`));}
function enrichReview(raw,r){r.verification=raw.verification||'reported';if(!['reported','checked','assumption'].includes(r.verification))throw Error('Invalid evidence verification label.');r.reference=t(raw.reference,2000);r.verificationNote=t(raw.verificationNote,3000);r.checkedAt=t(raw.checkedAt,10);if(r.verification==='checked'&&(!r.reference||!r.verificationNote||!validDate(r.checkedAt)))throw Error('Source-checked evidence needs a source reference, a check note, and a valid check date.');return r;}
function evidence(p,segmentId,channelId){const rows=p.discovery.reviews.filter(r=>r.segmentId===segmentId&&(!channelId||r.channelId===channelId)),sources=new Map();let reported=0,assumptions=0;for(const r of rows){if(r.verification==='assumption'){assumptions++;continue;}if(!S.reviewState(p,r).valid)continue;if(r.verification!=='checked'){reported++;continue;}const key=r.sourceType==='response'?'response:'+r.responseId:'source:'+r.reference.trim().toLowerCase();if(!sources.has(key))sources.set(key,new Set());sources.get(key).add(r.stance);}let supports=0,challenges=0,mixed=0;for(const stances of sources.values())if(stances.size>1||stances.has('mixed'))mixed++;else if(stances.has('supports'))supports++;else challenges++;return {rows,supports,challenges,mixed,sources:sources.size,reported,assumptions,stale:rows.filter(r=>!S.reviewState(p,r).valid).length};}

 if(selected){out.push('','## Channel research for '+selected.name,'Audience relevance and execution feasibility are separate. Relevance is a disclosed rule judgment; no reach, affinity, click-cost or performance statistics are available.');for(const x of matchChannels(p,selected.id))out.push('',`### ${x.name}`,`Audience relevance: ${x.relevance}`,`Execution: ${x.readiness}`,`Geographic check: ${x.availability.status} — ${x.availability.note}`,`Rule dimensions: ${x.breakdown.map(b=>b.name+' '+b.value+'/2').join('; ')}. Internal total ${x.relevanceScore}/6 is a planning rubric, not a probability.`,...x.breakdown.map(b=>'- '+b.reason),`Source-checked evidence: ${x.evidence.supports} supports; ${x.evidence.challenges} challenges; ${x.evidence.mixed} mixed. Adjustment ${x.adjustment}.`,...x.blockers.map(y=>'- Prerequisite: '+y),...x.gaps.map(y=>'- Unknown: '+y),`First action: ${x.first}`,`Limit: ${x.risk}`);
 out.push('','## Content opportunities');for(const x of contentOpportunities(p,selected.id))out.push('',`### ${x.title}`,`Format: ${x.format}`,`Angle: ${x.angle}`,`Potential route: ${x.channel}`,`Required proof: ${x.proof}`,`Call to action: ${x.cta}`);
 out.push('','## Prioritized validation experiments','All thresholds below are editable decision proposals, not benchmarks or significance claims.');for(const x of validationPlan(p,selected.id))out.push('',`### ${x.title}`,x.priority,`Hypothesis: ${x.hypothesis}`,`Method: ${x.method}`,`Measure: ${x.metric} / ${x.denominator}`,`Suggested rule: ${x.minAttempts} minimum observations; ${x.target}% threshold; ${x.days} days; USD ${x.budgetCap} cap.`);}
 out.push('','## Evidence register');for(const r of d.reviews){const state=S.reviewState(p,r);out.push('',`### ${r.verification==='checked'?'Source-checked by user':r.verification==='assumption'?'User assumption':'User-reported observation'} · ${r.stance}`,`Audience: ${r.segmentId}${r.channelId?' · '+r.channelId:''}`,`Observation: ${r.statement}`,`Source: ${state.label}`,`Reference: ${r.reference||'Not supplied'}`,`Check: ${r.verificationNote||'Not source-checked'}${r.checkedAt?' · '+r.checkedAt:''}`,`Link state: ${state.valid?'Current':'Stale — excluded from adjustments'}`);}if(!d.reviews.length)out.push('No reviewed evidence. The initial analysis remains hypothetical.');
 out.push('','## Recorded validation outcomes');for(const x of d.experiments){const r=S.experimentResult(x);out.push('',`### ${x.title}`,`${x.status} · ${x.signature===signature(p)?'Current brief':'Earlier brief retained for history'}`,`Original hypothesis: ${x.hypothesis}`,`Original method: ${x.method}`,`Rule: ${x.minAttempts} observations, ${x.target}% threshold, ${x.days} days.`,`${x.successes??'Not recorded'} / ${x.attempts??'not recorded'}${r.rate===null?'':` (${r.rate.toFixed(1)}%)`}. ${r.verdict}. Not market-wide validation.`,`Cap: USD ${x.budgetCap}. Spend: ${x.actualSpend??'not recorded'}.${r.overspent?' SPENDING CAP EXCEEDED.':''}`,`Source/result notes: ${x.resultNotes||'None recorded'}`);}if(!d.experiments.length)out.push('No completed or planned tests have been recorded.');

 const p=project(),b=d();return `<div class="brief-layout"><form id="setup-form"><div class="form-section"><h2>01 · The offer and the customer</h2><p>Be specific about the situation you want to improve. These are your inputs, not verified audience facts.</p><div class="form-grid"><div class="field full"><label for="project-name">Project name <small>(required)</small></label><input id="project-name" name="name" maxlength="120" required value="${E(p.name)}"></div>${textField('product','Product or service',p.setup.product,'What do you offer? What makes the offer different?',true)}${textField('market','Target market',p.setup.market,'Who could use it? Describe a role, activity, location, or situation.',true)}${textField('outcome','Desired customer outcome',b.outcome,'What should customers be able to do or experience?',true)}${selectField('customerType','Customer type',S.CHOICES.customerType,b.customerType)}${selectField('offerType','Offer type',S.CHOICES.offerType,b.offerType)}${textField('characteristics','Additional customer context',p.setup.characteristics,'Known behaviors or constraints. Avoid assumptions based only on demographics.')}</div><fieldset class="choice-fieldset"><legend>Outcome drivers <small>(choose 1–3)</small></legend><div class="driver-options">${Object.entries(S.BENEFITS).map(([key,label])=>`<label class="choice-option"><input type="checkbox" name="benefits" value="${key}" ${b.benefits.includes(key)?'checked':''}><span>${label}</span></label>`).join('')}</div></fieldset></div><div class="form-section"><h2>02 · The decision you need to make</h2><div class="form-grid">${textField('goals','Business goals',p.setup.goals,'What would you like to decide or achieve next?',true)}${selectField('primaryGoal','Primary goal',S.CHOICES.primaryGoal,b.primaryGoal)}${selectField('decision','Buying effort',S.CHOICES.decision,b.decision)}${selectField('salesScope','Sales scope',S.CHOICES.salesScope,b.salesScope)}${selectField('count','Number of potential segments',{'3':'3 focused hypotheses','4':'4 hypotheses','5':'5 hypotheses'},String(b.count))}${textField('assumptions','Assumptions to challenge',p.setup.assumptions,'What would evidence need to support or contradict?')}</div></div><div class="form-section"><h2>03 · Your practical constraints</h2><p>Unknown is a valid answer. A spending cap is not an estimate of what advertising will cost.</p><div class="form-grid"><div class="field"><label for="d-budget">Total test spending cap <small>(USD)</small></label><input id="d-budget" type="number" name="budget" min="0" max="1000000" step="0.01" value="${b.budget??''}" placeholder="Unknown"><p class="field-help">Enter 0 to exclude paid acquisition.</p></div><div class="field"><label for="d-hours">Available time <small>(hours per week)</small></label><input id="d-hours" type="number" name="hours" min="0" max="168" step="0.5" value="${b.hours??''}" placeholder="Unknown"><p class="field-help">Used to flag tactics that exceed your capacity.</p></div></div><fieldset class="choice-fieldset"><legend>What can you use today? <small>(select only existing assets)</small></legend><div class="asset-options">${Object.entries(S.ASSETS).map(([key,label])=>`<label class="check-option"><input type="checkbox" name="assets" value="${key}" ${b.assets.includes(key)?'checked':''}>${label}</label>`).join('')}</div></fieldset></div><div class="error" id="setup-error" role="alert"></div><div class="form-footer"><button type="submit" class="button primary">Save & discover audiences ${icon('arrow')}</button><span class="small muted" id="setup-status">${b.generatedAt?'Saved brief · edit to refine':'No surveys required'}</span></div></form><aside class="note-panel brief-note"><span class="pill">A STARTING POINT, NOT A VERDICT</span><h3>From what you know to what you can test.</h3><p>Your structured choices generate 3–5 customer scenarios and explainable channel comparisons.</p><ol><li>Who might need the outcome?</li><li>Why could the offer matter?</li><li>Can you reach them with your resources?</li><li>What would support or disprove the idea?</li></ol><hr><h3>What the app does not infer</h3><p>No market size, customer demographics, platform reach, ad prices, or conversion forecasts are invented. Profile details remain hypotheses until you examine evidence.</p><div class="spacer"></div>${link('See the decision rules','method')}<hr><p>Changing your brief keeps prior responses and test records. Older tests retain their original decision rules and are labeled as earlier-brief history.</p></aside></div>`;
}
function audience(){const tab=ctx.getTab(),b=d();return header('Understand who could benefit.','Build audience hypotheses from your offer. Use evidence when you have it.')+banner()+`<div class="tabs" role="tablist" aria-label="Audience workspace">${[['setup','Product brief'],['profiles','Audience profiles'],['evidence','Evidence · optional']].map(([key,label])=>`<button role="tab" aria-selected="${key===tab}" class="tab ${key===tab?'active':''}" data-action="audience-tab" data-tab="${key}">${label}</button>`).join('')}</div>`+(tab==='setup'?briefView():tab==='profiles'?profilesView():evidenceView());}
function profilesView(){
 const result=S.discover(project()),s=S.activeSegment(project());if(!s)return guard();const ev=S.evidence(project(),s.id),routes=S.matchChannels(project(),s.id).filter(c=>c.eligible).slice(0,2);
 return `<div class="profiles-layout"><aside class="profile-index"><p class="small muted">${result.segments.length} scenarios to investigate</p>${result.segments.map((x,i)=>`<button class="profile-index-item ${x.id===s.id?'active':''}" data-action="select-profile" data-id="${E(x.id)}"><span>${String(i+1).padStart(2,'0')}</span><strong>${E(x.name)}</strong><small>${x.points} relevance points · hypothesis</small></button>`).join('')}<p class="field-help">Scores express rule relevance, not audience size or demand. These scenarios may overlap.</p></aside><article class="profile-detail"><div class="profile-title"><div>${pill(s.userEdited?'HYPOTHESIS · EDITED BY YOU':'HYPOTHESIS')}<h2>${E(s.name)}</h2></div>${button('Edit profile','edit-profile',false,'edit',`data-id="${E(s.id)}"`)}</div><p class="profile-who">${E(s.who)}</p><div class="profile-fields">${[['needs','Customer needs'],['painPoints','Potential pain points'],['motivation','Purchase motivations'],['interests','Interests to investigate'],['buyingBehavior','Possible buying behavior'],['opportunity','Marketing opportunity']].map(([key,label])=>`<section><h3>${label}</h3>${lines(s[key])}</section>`).join('')}</div><section class="reasoning"><h3>Why this segment is relevant</h3><p class="small muted">Every point is traceable to an explicit rule. Prose is not classified with keywords.</p>${s.reasoning.map(r=>`<div class="reason-row"><span class="rule-id">${r.rule}</span><p>${E(r.reason)}</p><strong>+${r.points}</strong></div>`).join('')}</section><div class="profile-evidence"><div><h3>What supports or challenges this?</h3><p>${ev.supports} supporting · ${ev.challenges} challenging · ${ev.mixed} mixed sources${ev.stale?` · ${ev.stale} stale links`:''}</p></div>${button('Review evidence','review-evidence',false,'plus',`data-segment="${E(s.id)}"`)}</div>${ev.sources?`<p class="field-help">These are source-linked user interpretations, not independent verification or population estimates.</p>`:`<p class="field-help">No reviewed evidence yet. This profile remains an untested hypothesis.</p>`}<div class="section-heading"><h3>Candidate routes to investigate</h3>${link('Full channel comparison','channels')}</div>${routes.length?`<div class="route-suggestions">${routes.map(c=>`<div><strong>${E(c.name)}</strong><p>${E(c.first)}</p>${pill(c.readiness)}</div>`).join('')}</div>`:'<p class="small muted">No route meets the current prerequisites. Review Channels to see what needs preparation.</p>'}<div class="form-footer">${button('Plan a validation test','insights',true,'arrow')}</div></article></div>`;
}
function evidenceView(){const which=ctx.getEvidenceTab(),p=project(),a=S.analyze(p,ctx.getEvidenceSegment());return `<div class="evidence-intro"><div><h2>Bring evidence when you have it.</h2><p>Research supports the strategy. It is not a prerequisite for an initial analysis.</p></div>${button('Record an observation','review-evidence',false,'plus')}</div><div class="subtabs" role="tablist" aria-label="Optional research evidence">${[['reviews','Reviewed evidence'],['summary','Observed answers'],['responses',`Responses (${p.responses.length})`],['planner','Survey & interview guide']].map(([key,label])=>`<button class="${which===key?'active':''}" data-action="evidence-tab" data-tab="${key}" role="tab" aria-selected="${which===key}">${label}</button>`).join('')}</div>${which==='responses'?responsesView():which==='planner'?plannerView():which==='summary'?evidenceSummary(a):reviewList()}`;}
function reviewList(){const rows=d().reviews;if(!rows.length)return empty('Keep a traceable record.','Link a customer answer or describe a specific observation. Record whether it supports, challenges, or complicates an audience hypothesis.',button('Add reviewed evidence','review-evidence',true,'plus'),'file');return `<div class="info-line">${icon('info')}<span>These labels are your interpretation. The app never treats an observation as a verified market fact. Edited or removed response sources become stale.</span></div><div class="review-list">${rows.map(r=>{const state=S.reviewState(project(),r),profile=S.discover(project()).segments.find(s=>s.id===r.segmentId);return `<article class="review-item"><div class="review-heading"><div>${pill(state.valid?r.stance.toUpperCase():'STALE SOURCE')}${pill(profile?.name||r.segmentId)}${r.channelId?pill(S.CHANNEL_RULES.find(c=>c.id===r.channelId)?.name||r.channelId):''}</div>${button('Review','edit-evidence',false,'edit',`data-id="${E(r.id)}"`)}</div><p>${E(r.statement)}</p><p class="review-source">Source: ${E(state.label)}${r.date?' · '+E(r.date):''}</p>${state.response?`<details><summary>Read the original response</summary>${['needs','painPoints','interests','motivation','notes'].filter(k=>state.response[k]).map(k=>`<blockquote class="quote"><strong>${S.LABELS[k]}</strong><br>${E(state.response[k])}</blockquote>`).join('')}<p class="small">Channels: ${E(state.response.channels.join(', ')||'Not answered')}</p></details>`:''}</article>`;}).join('')}</div>`;}
function evidenceSummary(a){return `<div class="toolbar">${filter()}${pill(project().kind==='sample'?'FICTIONAL SAMPLE':'USER-PROVIDED ANSWERS')}</div>${!a.total?empty('No responses yet. Your strategy still works.','Add responses if they help you test a hypothesis. They are optional.',button('View audience hypotheses','profiles',true)+button('Add a response','add-response')):`<div class="two-column"><section class="panel"><div class="panel-heading"><h2>Reported channel preferences</h2></div>${chart(a,true)}</section><aside class="note-panel"><h3>Observed answers, not recommended channels</h3><p>${a.total} responses in this view. ${a.channelAnswered} answered the channel question; ${a.channelMissing} did not. Multiple choices are allowed.</p><hr><h3>Stated purchase intent</h3><p>${a.intentAnswered?`${a.intentAverage}/5 average from ${a.intentAnswered} answers. ${a.total-a.intentAnswered} missing.`:'No purchase intent recorded.'}</p><p>This measures a stated answer, not purchasing behavior.</p></aside></div><div class="section-heading"><h2>Listen to the original words</h2>${link('Review a source','review-evidence')}</div><p class="small muted">No automatic theme or sentiment classification. Review answers in context, then link them to a hypothesis.</p><div class="raw-answer-grid">${['needs','painPoints','interests','motivation'].map(f=>{const rows=a.rows.filter(r=>r[f]);return `<section class="panel"><h3>${S.LABELS[f]}</h3><p class="small">${rows.length} answered · ${a.total-rows.length} missing</p>${rows.slice(0,3).map(r=>`<blockquote class="quote">“${E(r[f])}”<footer>${E(r.respondent||'Anonymous')}</footer></blockquote>`).join('')||'<p class="small muted">No answers yet.</p>'}${rows.length>3?`<p class="field-help">Showing 3 originals. All answers remain in Responses and CSV exports.</p>`:''}</section>`;}).join('')}</div>`}`;}
function channelsView(){
 const p=project(),s=S.activeSegment(p);if(!s)return header('Find a practical route to your audience.','Compare channel hypotheses against your offer and available resources.')+guard();const ranks=S.matchChannels(p,s.id),b=d(),compared=b.compare.length?ranks.filter(c=>b.compare.includes(c.id)):ranks.slice(0,2);
 return header('Choose a channel for a reason.','Compare audience fit, product fit, reachability, and what you can realistically commit.',button('Edit constraints','setup',false,'edit'))+banner()+`<div class="toolbar">${segmentSelector()}<span class="resource-context">${b.budget===null?'Budget unknown':`USD ${b.budget} cap`} · ${b.hours===null?'Time unknown':`${b.hours} h/week`}</span></div><div class="info-line">${icon('info')}<span>Scores are planning points, not success probabilities. Prerequisites can exclude a channel regardless of its score. ${link('How scoring works','method')}</span></div><div class="section-heading"><h2>Channel fit matrix</h2><p class="small muted">Select up to 3 to compare in detail</p></div><div class="table-wrap channel-matrix"><table><thead><tr><th>Compare</th><th>Channel</th><th>Audience<br><small>30 points</small></th><th>Product<br><small>25 points</small></th><th>Access<br><small>25 points</small></th><th>Budget/time<br><small>20 points</small></th><th>Total<br><small>out of 100</small></th><th>Readiness</th></tr></thead><tbody>${ranks.map(c=>`<tr class="${c.eligible?'':'constrained'}"><td><input type="checkbox" data-compare-id="${c.id}" aria-label="Compare ${E(c.name)}" ${b.compare.includes(c.id)?'checked':''}></td><td><strong>${E(c.name)}</strong><p>${c.hours} h/week allowance</p></td>${c.breakdown.map(v=>`<td>${v.value}<span class="muted">/3</span></td>`).join('')}<td><strong>${c.score}</strong></td><td>${pill(c.readiness)}</td></tr>`).join('')}</tbody></table></div><p class="field-help">Each 0–3 rating is scaled by its column weight. Eligible channels appear first; ties sort alphabetically. Time allowances are planning assumptions, not measured industry averages. Adjust your available capacity in the brief.</p><div class="section-heading"><h2>${b.compare.length?'Your comparison':'Suggested comparison'}</h2><span class="small muted">${compared.length} channels</span></div><div class="channel-explanations">${compared.map(c=>`<section class="panel channel-explanation"><div class="panel-heading"><div><h2>${E(c.name)}</h2><p>${E(c.description)}</p></div><span class="score-number">${c.score}<small>/100</small></span></div>${pill(c.readiness)}<div class="score-breakdown">${c.breakdown.map(v=>`<details><summary><span>${v.name}</span><strong>${v.points.toFixed(1)} / ${v.weight}</strong></summary><p>${E(v.reason)}</p></details>`).join('')}</div>${c.blockers.length?`<div class="constraint-note"><h3>Prepare first</h3>${list(c.blockers)}</div>`:''}${c.gaps.length?`<div class="constraint-note"><h3>Still unknown</h3>${list(c.gaps)}</div>`:''}<h3>Why it might work</h3><p>${E(c.first)}</p><h3>What could make it fail</h3><p>${E(c.risk)}</p><p class="small">Reviewed sources: ${c.evidence.supports} support · ${c.evidence.challenges} challenge · ${c.evidence.mixed} mixed${c.adjustment?` · audience-fit adjustment ${c.adjustment>0?'+1':'−1'}`:''}</p><div class="button-row">${button(c.eligible?'Plan a channel test':'Review prerequisites',c.eligible?'channel-test':'channel-constraints',c.eligible,'',`data-id="${c.id}"`)}${button('Link evidence','review-evidence',false,'',`data-channel="${c.id}"`)}</div></section>`).join('')}</div><div class="evidence-band"><div><h3>Preferences and performance are different.</h3><p>Survey channel preferences stay in Evidence. They do not automatically determine these recommendations.</p></div>${link('Review responses','evidence-summary')}</div>`;
}
function projectNotes(p){return `<form id="experiment-form" style="margin-top:28px"><label for="experiment-notes">Project notes & earlier research</label><textarea id="experiment-notes" name="notes" maxlength="10000" placeholder="Capture context, findings, and decisions. Existing project notes are preserved.">${E(p.experimentNotes)}</textarea><div class="button-row" style="margin-top:12px"><button type="submit" class="button">Save notes</button></div></form>${Object.keys(p.actions).length?`<details class="legacy-records"><summary>Earlier checklist records (${Object.keys(p.actions).length})</summary><p class="small">Preserved from the previous workflow. These do not establish validation of the new hypotheses.</p>${list(Object.entries(p.actions).map(([k,v])=>`${k}: ${v?'Completed':'To do'}`))}</details>`:''}`;}
function otherTests(p,selected){const other=S.brief(p).experiments.filter(x=>x.segmentId!==selected);return other.length?`<details class="legacy-records"><summary>Tests for other or earlier hypotheses (${other.length})</summary><p class="small">Original plans and results remain available after the brief changes.</p>${other.map(x=>`<div class="history-test"><div><strong>${E(x.title)}</strong><p>${E(x.segmentId)} · ${E(x.status)} · ${E(S.experimentResult(x).verdict)}</p></div>${button(x.status==='planned'?'Review draft':'Review results','edit-test',false,'',`data-id="${E(x.id)}"`)}</div>`).join('')}</details>`:'';}
function insightsView(){const p=project(),s=S.activeSegment(p);if(!s)return header('Turn a hypothesis into a useful test.','Define what you need to learn before spending money or scaling a channel.')+guard()+projectNotes(p)+otherTests(p,'');const b=d(),plans=S.validationPlan(p,s.id),saved=b.experiments.filter(x=>x.segmentId===s.id),allocated=b.experiments.filter(x=>x.signature===S.signature(p)).reduce((n,x)=>n+x.budgetCap,0);return header('Test a little. Learn a lot.','Choose one hypothesis, define the decision rule, and record what actually happens.')+banner()+`<div class="toolbar">${segmentSelector()}${pill('VALIDATION · NO RESULTS INVENTED')}</div><div class="info-line">${icon('info')}<span>Work through these tests sequentially. Suggested counts and thresholds are editable starting points, not market benchmarks or statistical guarantees. ${b.hours===0?'You have no available time; resolve capacity before starting.':''}</span></div><div class="section-heading"><h2>What to test first</h2><span class="small muted">3 practical steps</span></div><div class="validation-steps">${plans.map((x,i)=>`<section class="validation-step"><span class="step-order">${String(i+1).padStart(2,'0')}</span><div><h3>${E(x.title)}</h3><p>${E(x.hypothesis)}</p><details><summary>Method & proposed decision rule</summary><p>${E(x.method)}</p><dl><dt>Measure</dt><dd>${E(x.metric)} / ${E(x.denominator)}</dd><dt>Proposal</dt><dd>${x.minAttempts} minimum observations · ${x.target}% threshold · ${x.days} days</dd><dt>Resources</dt><dd>USD ${x.budgetCap} cap · ${x.hours} h/week planning allowance${x.capacityKnown?'':' · availability unknown'}</dd></dl></details></div>${button('Configure test','configure-test',i===0,'',`data-type="${x.type}"`)}</section>`).join('')}</div><div class="section-heading"><div><h2>Your saved tests</h2><p>${saved.length} for this hypothesis · ${allocated.toFixed(2)} / ${b.budget===null?'unknown':b.budget.toFixed(2)} USD allocated across current-brief tests</p></div></div>${saved.length?`<div class="saved-tests">${saved.map(x=>{const r=S.experimentResult(x);return `<section class="panel saved-test"><div class="panel-heading"><div>${pill(x.status.toUpperCase())}${x.signature!==S.signature(p)?pill('EARLIER BRIEF'):''}<h3>${E(x.title)}</h3></div><span class="test-verdict">${E(r.verdict)}</span></div><p>${E(x.hypothesis)}</p><div class="test-results"><div><strong>${x.successes??'—'} / ${x.attempts??'—'}</strong><span>recorded outcomes / observations</span></div><div><strong>${r.rate===null?'—':r.rate.toFixed(1)+'%'}</strong><span>observed rate, not a forecast</span></div><div><strong>${x.target}%</strong><span>your decision threshold</span></div></div><p class="small">Minimum ${x.minAttempts} observations · ${x.days} days · USD ${x.budgetCap} spending cap${x.startedAt?' · decision rule locked':''}</p>${r.overspent?'<div class="error">Recorded spending exceeds this test’s cap.</div>':''}${x.resultNotes?`<p class="recorded-note">${E(x.resultNotes)}</p>`:''}<div class="button-row">${x.status==='planned'?button('Start test','start-test',true,'',`data-id="${E(x.id)}"`):''}${button(x.status==='planned'?'Edit test':x.status==='running'?'Record results':'Review results','edit-test',x.status==='running','',`data-id="${E(x.id)}"`)}${x.status==='planned'?button('Remove draft','remove-test',false,'trash',`data-id="${E(x.id)}"`):''}</div></section>`;}).join('')}</div>`:empty('Set a decision rule before you run a test.','Configure one of the suggested tests above. When you start it, its hypothesis and threshold are locked so you can compare results honestly.','','chart')}${projectNotes(p)}${otherTests(p,s.id)}`;}
function reportsView(){const p=project(),s=S.activeSegment(p),a=S.analyze(p,ctx.getEvidenceSegment());return header('A strategy you can explain.','Export who to target, why they may fit, where to reach them, and what to test.',button('Export strategy','export-report',true,'download'))+banner()+`<div class="toolbar">${s?segmentSelector():pill('BRIEF INCOMPLETE')}<span class="small muted">Live report · hypotheses and evidence separated</span></div><div class="report-grid"><article class="report-paper" aria-label="Strategy report preview">${pill(p.kind==='sample'?'SAMPLE STRATEGY':'HYPOTHESES · EVIDENCE · TESTS')}${markdownHTML(S.reportMarkdown(p,ctx.getEvidenceSegment()))}</article><aside><h2>Keep the reasoning with the result.</h2><p class="small" style="margin-top:10px">Includes every audience profile, the selected profile’s channel breakdown, prerequisites, validation proposals, saved outcomes, and supporting evidence.</p><div class="export-list"><div class="export-item"><h3>Strategy report</h3><p>Readable without the app. All scores and evidence limitations are included.</p><div class="button-row">${button('Markdown','export-report',false,'download')}${button('HTML','export-html')}${button('Print / PDF','print-report')}</div></div><div class="export-item"><h3>Original response data</h3><p>Export ${a.total} ${ctx.getEvidenceSegment()?'filtered':'original'} responses. Hypotheses are never written as survey answers.</p>${filter()}<div class="spacer"></div>${button('Download CSV','export-csv',false,'download')}</div><div class="export-item"><h3>Back up the complete project</h3><p>Includes the brief, profile edits, reviewed sources, test plans, outcomes, original responses, and research guide.</p><div class="button-row">${button('Back up project','backup-project',false,'download')}${button('Back up all','backup-all')}</div></div><div class="export-item"><h3>Restore a backup</h3><p>Version 1 and version 2 backups are supported. Restored projects are added as separate copies.</p>${button('Restore backup','restore')}</div></div><p class="footer-note">Save open forms before exporting. Review personal information before sharing a report.</p></aside></div>`;}
function methodHTML(){return `<div class="help-sections"><h3>Audience discovery: explicit scenario rules</h3><p>No language model, demographic inference, or keyword search is used to choose segments. Each eligible scenario begins with 1 comparison point. A selected outcome driver adds 5; matching offer type adds 2; matching business buyer context adds 2; matching goal adds 1; matching buying effort adds 2; local relevance adds 2. The highest 3–5 scenarios are shown. Ties use stable scenario identifiers.</p><p>Every profile detail remains a hypothesis. Scores express internal rule relevance, not demand or customer counts. Editing profile prose does not alter scores; change the structured brief to change the analysis.</p><h3>Channel comparison</h3><div class="table-wrap"><table><thead><tr><th>Dimension</th><th>Weight</th><th>Reasoning</th></tr></thead><tbody><tr><td>Audience fit</td><td>30</td> <td>Buyer-context match: 2; otherwise 1. Add 1 for a matching scenario driver, capped at 3.</td></tr><tr><td>Product fit</td><td>25</td><td>Offer-format match: 3; otherwise 2. Organic search loses 1 for immediate validation/acquisition; online-only scope gives local events 0.</td></tr><tr><td>Reachability</td><td>25</td><td>Relevant asset reported: 3; otherwise 1. Actual audience activity remains unverified.</td></tr><tr><td>Budget & time</td><td>20</td><td>Lower of cash and time ratings. No required ad spend: cash 3. Positive paid-test cap: cash 2; unknown: 1; zero: 0. Enough time: 3; unknown or below allowance: 1; zero: 0.</td></tr></tbody></table></div><p>Each rating is divided by 3, multiplied by its weight, then summed and rounded to a whole planning point. This is not a probability. Access and resource blockers take precedence; eligible channels sort before blocked ones. Tie scores sort alphabetically.</p><p>Channel time allowances (1–4 hours/week) are planning choices in this app. They are not measured industry requirements. A known time budget below the allowance is flagged so you can change scope or the brief before proceeding. “Ready to test” means prerequisites were reported; it does not mean a channel is proven effective.</p><h3>Evidence adjustments</h3><p>Sources are manually linked to a profile and, optionally, a channel. Each response ID or normalized observation-source label counts once. Conflicting labels from the same source count as mixed. At least 2 supporting sources, with more support than challenge, add 1 audience-fit point. More challenging than supporting sources subtracts 1. Ratings remain within 0–3. This small adjustment is a transparent heuristic; source independence and authenticity are not verified.</p><p>Changing an audience profile, or editing or deleting an underlying response, makes its evidence links stale. They are excluded until reviewed again. Imported channel counts do not automatically change channel fit. Original answers are displayed without automated theme or sentiment labels.</p><h3>Validation outcomes</h3><p>A test must meet its user-set minimum observations before it can meet the user-set percentage rule. Successes / observations × 100 is calculated only from recorded values. A met rule is not statistical significance or market-wide validation. Started tests lock the hypothesis, method, threshold, duration, and spending cap. Report corrections remain possible, with source/result notes.</p><h3>Practical platform references</h3><p>These public references explain platform prerequisites, not AudienceScout’s scoring weights. Reading them is optional and requires internet access.</p><ul><li><a href="https://mailchimp.com/help/the-importance-of-permission/" target="_blank" rel="noopener noreferrer">Permission-based email</a></li><li><a href="https://support.google.com/google-ads/answer/10486637/about-spending-limits" target="_blank" rel="noopener noreferrer">Google Ads spending controls</a> — an app planning cap does not configure an ad account.</li><li><a href="https://developers.google.com/search/docs/fundamentals/seo-starter-guide" target="_blank" rel="noopener noreferrer">Google Search fundamentals</a></li></ul></div>`;}
return {dashboard,audience,setupView:briefView,profilesView,evidenceView,evidenceSummary,channelsView,insightsView,reportsView,methodHTML,banner,segmentSelector};

(function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory;else root.ScoutWorkbench=factory;})(typeof globalThis!=='undefined'?globalThis:this,function(ctx,base){

function sample(){return project().kind==='sample'?`<div class="sample-notice">${badge('Example project','hypothesis')}<span>Fictional brief for exploring the tool. It does not establish audience demand.</span>${link('Create your project','new-project')}</div>`:'';}

function evidenceCounts(){const p=project(),valid=p.discovery.reviews.filter(r=>S.reviewState(p,r).valid),checked=valid.filter(r=>r.verification==='checked');return {checked:new Set(checked.map(r=>r.sourceType==='response'?r.responseId:r.reference.trim().toLowerCase())).size,reported:valid.filter(r=>r.verification!=='checked'&&r.verification!=='assumption').length,assumptions:p.discovery.reviews.filter(r=>r.verification==='assumption').length,stale:p.discovery.reviews.filter(r=>!S.reviewState(p,r).valid).length,tests:p.discovery.experiments.filter(r=>r.status==='completed').length};}
function shell(state,route,content,{storageAvailable,conflict,searchDraft}){const p=project(),c=p.discovery.context,query=searchDraft??p.setup.product,nav=[['dashboard','Overview','home'],['audience','Audience profiles','users'],['channels','Channels','layers'],['evidence','Evidence','file'],['insights','Strategy','chart'],['reports','Reports','download']];return `<header class="app-header"><a class="brand" href="#dashboard" aria-label="AudienceScout dashboard"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2"/><path d="m22 10-4 10-8 2 4-10z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="2" fill="currentColor"/></svg>AudienceScout</a><span class="header-divider"></span><span class="workspace-label">Research workspace</span><div class="header-project"><select id="project-select" aria-label="Current project">${state.projects.map(x=>option(x.id,x.name,p.id)).join('')}</select><button class="icon-button" data-action="new-project" aria-label="New project">${icon('plus')}</button></div>${link('Method','method')}<div class="header-right"><span>${icon('laptop')}${storageAvailable?'Local only':'Session only'}</span>${button('Export report','export-report',true,'download')}${button('Help & data','help',false,'help')}</div></header><div class="research-shell"><section class="search-panel" aria-label="Audience research search"><form id="search-brief-form"><label for="audience-query">Explore an audience</label><div class="search-control">${icon('search')}<input id="audience-query" name="query" aria-label="Product and audience search" value="${E(query)}" maxlength="5000" placeholder="Describe your product and who it helps" required></div><button type="submit" class="button primary">Analyze audience</button></form><div class="search-context">${c?`${badge(c.industry)}${badge(I.scope(p))}${badge(R.MODELS[c.model]||'Model not set')}`:badge('Add a research brief to begin')}${link('Edit research brief','setup')}${link('Example briefs','examples')}</div></section><nav class="nav analysis-tabs" aria-label="Analysis navigation">${nav.map(([id,label,ic])=>`<a href="#${id}" ${route===id?'aria-current="page"':''} class="${route===id?'active':''}">${icon(ic)}${label}</a>`).join('')}</nav><main id="main" class="research-main">${!storageAvailable?'<div class="banner"><p><strong>Browser storage is unavailable.</strong> Export a backup before closing this session.</p>'+link('Back up now','backup-all')+'</div>':''}${conflict?'<div class="banner"><p><strong>This workspace changed in another window.</strong> Reload to use the latest data.</p>'+link('Reload','reload')+'</div>':''}${content}</main><footer class="app-footer"><span>AudienceScout 3.0 · Your data stays in this browser</span><span>${storageAvailable?'Saved changes are stored on this device':'Session only · export before closing'}</span>${link('Back up workspace','backup-all')}</footer></div>`;}
function setupView(){const p=project(),d=S.brief(p),c=d.context||I.contextDefaults();return header('Define your research brief','Start with what you sell, who could use it, and the decisions you need to make. Evidence can come later.')+sample()+`<div class="brief-layout"><form id="research-brief-form"><section class="brief-section"><h2>The product and its customers</h2><div class="form-grid">${input('name','Project name',p.name,true)}${input('industry','Industry / category',c.industry,true,'e.g. Retail operations software')}${area('product','Product description',ctx.getSearchDraft()??p.setup.product,true,'What is being sold, what does it do, and who is it for?')}${area('market','Target customer',p.setup.market,true,'Describe the role, situation or organization you want to investigate.')}${area('useCases','Use cases',c.useCases,true,'List concrete tasks or buying occasions, separated by semicolons or new lines.')}${select('model','Business model',R.MODELS,c.model,true)}${select('region','Geographic market',R.REGIONS,c.region,true)}${input('geography','City / service area / additional countries',c.geography,false,'Required for local retail or another/multiple countries')}${select('count','Potential segments',{'3':'3 focused segments','4':'4 segments','5':'5 segments'},String(d.count))}</div></section><section class="brief-section"><h2>Goals and purchase roles</h2><div class="form-grid">${area('goals','Business goals',p.setup.goals,false,'Which audience or channel decision do you need to make?')}${input('buyer','Who pays? (if known)',c.buyer,false,'e.g. Fruit shop owner')}${input('endUser','Who uses the product? (if known)',c.endUser,false,'e.g. Shop manager and stock-handling staff')}${select('primaryGoal','Current priority',S.CHOICES.primaryGoal,d.primaryGoal||'validate')}${select('salesScope','Sales scope',{'':'Infer from business model',...S.CHOICES.salesScope},d.context?d.salesScope:'')}${area('characteristics','Additional customer context',p.setup.characteristics)}${area('assumptions','Your assumptions to challenge',p.setup.assumptions)}</div></section><details class="brief-section" open><summary>Execution constraints <span>Optional; unknown is a valid answer</span></summary><div class="form-grid"><div class="field"><label for="brief-budget">Total test budget (USD)</label><input id="brief-budget" name="budget" type="number" min="0" max="1000000" step="0.01" value="${d.budget??''}" placeholder="Unknown"><p class="field-help">0 excludes paid tests. No advertising prices are inferred.</p></div><div class="field"><label for="brief-hours">Available hours per week</label><input id="brief-hours" name="hours" type="number" min="0" max="168" step="0.5" value="${d.hours??''}" placeholder="Unknown"></div><fieldset class="field full"><legend>Existing capabilities and access</legend><div class="check-grid">${Object.entries(S.ASSETS).map(([k,v])=>`<label class="check-option"><input type="checkbox" name="assets" value="${k}" ${d.assets.includes(k)?'checked':''}>${E(v)}</label>`).join('')}</div></fieldset>${select('domain','Interpretation override',R.DOMAINS,c.domain||'auto')}</div></details><div class="error" id="research-error" role="alert"></div><div class="form-footer"><button type="submit" class="button primary">Analyze research brief</button><span id="setup-status">No surveys or CSV required</span></div></form><aside class="brief-guide"><h3>Define the purchase, not a stereotype.</h3><p>Product function, industry, use cases and purchase roles shape the scenarios.</p><ol><li>Explain what the product actually does.</li><li>Name the person or business paying.</li><li>Separate the end user if someone else uses it.</li><li>Include the market and practical constraints.</li></ol><h3>What you will receive</h3><p>3–5 specific job or buying-situation hypotheses, source categories to research, channel comparisons and a validation sequence.</p><h3>What needs evidence</h3><p>Demand, audience behavior, actual information sources, geographic channel access and willingness to pay.</p>${link('Inspect the method','method')}<div class="mini-examples"><h3>Try the four example briefs</h3>${Object.entries(I.EXAMPLES).map(([id,x])=>button(E(x.name),'load-example',false,'',`data-example="${id}"`)).join('')}</div></aside></div>`;}
function segmentTable(segments,comparison=false){return `<div class="table-wrap"><table class="segment-table"><thead><tr><th>#</th><th>Potential segment</th><th>Buyer / user</th><th>${comparison?'Need to investigate':'Context relevance'}</th><th>Evidence</th></tr></thead><tbody>${segments.map((s,i)=>{const ev=S.evidence(project(),s.id);return `<tr class="${selected()?.id===s.id?'is-selected':''}"><td>${i+1}</td><td><button class="table-link" data-action="profile" data-id="${E(s.id)}">${E(s.name)}</button>${comparison?`<p>${E(s.motivation)}</p>`:''}</td><td>${comparison?`${E(s.buyer||'Not specified')}<p>User: ${E(s.user||'Not specified')}</p>`:E(({'buyer-user':'Buyer & user','buyer':'Buyer','buyer-influencer':'Buyer / influencer','user':'End user','user-influencer':'User / influencer'})[s.role]||'Not specified')}</td><td>${comparison?E(s.needs):badge(s.relevance||'Legacy hypothesis',s.relevance==='Direct context fit'?'fit':'hypothesis')}</td><td>${badge(ev.sources?`${ev.sources} checked source${ev.sources===1?'':'s'}`:'No checked evidence',ev.sources?'checked':'neutral')}</td></tr>`;}).join('')}</tbody></table></div>`;}
function dashboard(){const p=project(),result=S.discover(p);if(!modern())return legacyNotice()+base.dashboard();if(!result.ready)return setupView();const s=selected(),channels=S.matchChannels(p,s.id),ev=evidenceCounts(),plans=S.validationPlan(p,s.id);return header('Audience research overview',`${p.name} · ${result.segments.length} candidate segments · Hypotheses until tested`,button('Compare segments','compare-segments',false,'users'))+sample()+`<div class="research-status"><div>${icon('users')}<strong>${result.segments.length}</strong> audience hypotheses</div><div>${icon('file')}<strong>${ev.checked}</strong> checked sources</div><div>${icon('chart')}<strong>${ev.tests}</strong> completed tests</div><div>${badge(ev.checked?'Evidence linked':'Evidence needed',ev.checked?'checked':'hypothesis')}</div></div><div class="overview-grid"><section class="research-panel segment-panel"><div class="panel-title"><h2>${icon('users')}Potential customer segments</h2>${link('All profiles','profiles')}</div>${segmentTable(result.segments)}</section><section class="research-panel selected-audience"><h2>${icon('users')}Selected audience</h2><h3>${E(s.name)}</h3><dl><dt>Need to investigate</dt><dd>${E(s.needs)}</dd><dt>Purchase trigger</dt><dd>${E(s.motivation)}</dd><dt>Buyer vs. user</dt><dd><strong>Buyer:</strong> ${E(s.buyer)}<br><strong>User:</strong> ${E(s.user)}</dd></dl>${button('Open audience profile','profiles',true,'arrow')}</section><section class="research-panel routes-panel"><div class="panel-title"><h2>${icon('search')}Where to investigate</h2>${link('Research channels','channels')}</div><div class="table-wrap"><table><thead><tr><th>Research route</th><th>Audience relevance</th><th>Execution</th><th>Evidence</th></tr></thead><tbody>${channels.slice(0,3).map(c=>`<tr><td><button class="table-link" data-action="focus-channel" data-id="${c.id}">${E(c.name)}</button></td><td>${badge(c.relevance,'fit')}</td><td>${E(c.readiness)}</td><td>${badge('Hypothesis','hypothesis')}</td></tr>`).join('')}</tbody></table></div></section><section class="research-panel priorities-panel"><h2>${icon('chart')}Research priorities</h2><ol class="priority-list">${plans.map(x=>`<li><strong>${E(x.title)}</strong><span>${E(x.priority||'')}</span></li>`).join('')}</ol>${link('Build validation plan','insights')}</section></div><details class="interpretation"><summary>How your brief was interpreted · ${E(R.DOMAINS[result.interpretation.domain])}</summary>${list(result.interpretation.rules)}${result.interpretation.warnings.length?`<div class="warning-box">${list(result.interpretation.warnings)}</div>`:''}<p class="small">These are transparent scenario rules, not a statistical classification or live database result.</p>${link('Correct the brief or interpretation','setup')}</details>`+boundary();}
function profileView(){if(!modern())return legacyNotice()+base.profilesView();const p=project(),found=S.discover(p);if(!found.ready)return setupView();const s=selected(),ev=S.evidence(p,s.id);if(ctx.getProfileMode()==='compare')return header('Compare potential audiences','Compare purchase roles and distinct needs before choosing one segment to investigate.',button('Open selected profile','profile-detail'))+segmentTable(found.segments,true)+boundary();return header('Audience intelligence','Every profile is a research hypothesis. Buyer approval and end-user adoption are separate questions.',button('Compare segments','compare-segments',false,'users'))+sample()+`<div class="toolbar">${segmentSelect()}${badge(s.relevance,'fit')}${button('Edit profile','edit-profile',false,'edit',`data-id="${s.id}"`)}${button('Edit brief','setup')}</div><div class="profile-workspace"><article class="research-panel"><div class="profile-heading">${badge(s.userEdited?'User-refined hypothesis':'System hypothesis','hypothesis')}<h2>${E(s.name)}</h2><p>${E(s.who)}</p></div><div class="purchase-roles"><div><span>Proposed buyer</span><strong>${E(s.buyer)}</strong></div><div><span>Proposed end user</span><strong>${E(s.user)}</strong></div></div>${s.capabilityGap?`<div class="warning-box">${E(s.capabilityGap)}</div>`:''}<div class="intelligence-fields">${[['needs','Customer need'],['painPoints','Pain points to investigate'],['motivation','Purchase motivations'],['interests','Interests to investigate'],['buyingBehavior','Buying behavior hypothesis'],['opportunity','Marketing opportunity']].map(([k,v])=>`<section><h3>${v}</h3>${ptext(s[k])}</section>`).join('')}</div><section class="profile-reasons"><h3>Supporting reasoning</h3>${list(s.reasoning.map(r=>r.reason))}<p class="small">Profile edits refine wording. Change the research brief to change the underlying job and channel rules.</p></section></article><aside><section class="research-panel"><h2>Research questions</h2>${list(s.questions)}${button('Build validation plan','insights',true)}</section><section class="research-panel"><h2>Evidence for this hypothesis</h2><div class="evidence-counts"><div><strong>${ev.supports}</strong>supports</div><div><strong>${ev.challenges}</strong>challenges</div><div><strong>${ev.mixed}</strong>mixed</div></div><p>${ev.reported||0} user-reported links · ${ev.stale} stale links</p><p class="small">Counts are source identifiers checked by the user. They do not establish independence or population support.</p>${button('Add research finding','review-evidence',false,'plus',`data-segment="${s.id}"`)}</section></aside></div><div class="section-heading"><h2>Potential information sources</h2>${badge('Research leads, not findings','hypothesis')}</div><div class="table-wrap"><table><thead><tr><th>Source category</th><th>Draft discovery query</th><th>What to verify</th></tr></thead><tbody>${s.sources.map(x=>`<tr><td><strong>${E(x.type)}</strong></td><td>${E(x.query)}</td><td>${E(x.check)}</td></tr>`).join('')}</tbody></table></div><section class="research-panel search-ideas"><h2>Search and content questions to investigate</h2>${list(s.searchIdeas)}<p class="small">Draft phrases generated from your brief. No search volume, popularity or existing source is asserted.</p></section>`+boundary();}
function audience(){return ctx.getTab()==='setup'?setupView():profileView();}
function relevanceMap(channels){return `<div class="relevance-map"><div class="panel-title"><h2>Relevance × execution</h2><span>Planning judgments, not audience statistics</span></div><div class="table-wrap"><table><thead><tr><th>Execution</th><th>High relevance</th><th>Moderate relevance</th><th>Low relevance</th></tr></thead><tbody>${['Ready for a small test','Investigate access','Prepare first'].map(status=>`<tr><th>${status}</th>${['High','Moderate','Low'].map(rel=>`<td>${channels.filter(c=>c.readiness===status&&c.relevance===rel).map(c=>`<button data-action="focus-channel" data-id="${c.id}" class="map-chip">${E(c.name)}</button>`).join('')||'<span class="muted">No channels</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;}
function channelsView(){if(!modern())return legacyNotice()+base.channelsView();const p=project(),s=selected();if(!s)return setupView();const all=S.matchChannels(p,s.id),f=ctx.getChannelFilters(),ranks=all.filter(c=>(!f.relevance||c.relevance===f.relevance)&&(!f.readiness||c.readiness===f.readiness)&&(!f.query||`${c.name} ${c.reason}`.toLowerCase().includes(f.query.toLowerCase()))),compared=(p.discovery.compare.length?all.filter(c=>p.discovery.compare.includes(c.id)):all.slice(0,2));return header('Channel research','Find relevant routes, then check geographic access, budget and execution requirements.',button('Edit capabilities','setup',false,'edit'))+sample()+`<div class="toolbar">${segmentSelect()}${badge(`${p.discovery.budget===null?'Budget unknown':'USD '+p.discovery.budget+' cap'} · ${p.discovery.hours===null?'Time unknown':p.discovery.hours+' h/week'}`)}${link('How relevance works','method')}</div>${relevanceMap(all)}<div class="channel-filter-bar"><label>Relevance<select id="channel-relevance">${option('','All relevance',f.relevance)}${['High','Moderate','Low'].map(x=>option(x,x,f.relevance)).join('')}</select></label><label>Execution<select id="channel-readiness">${option('','All execution states',f.readiness)}${['Ready for a small test','Investigate access','Prepare first'].map(x=>option(x,x,f.readiness)).join('')}</select></label><label class="channel-search">Find a channel<input id="channel-query" type="search" value="${E(f.query)}" placeholder="Search evaluated routes"></label><span>${ranks.length} of ${all.length} routes · compare up to 3</span></div><div class="table-wrap"><table class="research-channel-table"><thead><tr><th>Compare</th><th>Channel / route</th><th>Audience relevance</th><th>Execution feasibility</th><th>Geographic check</th><th>Checked sources</th></tr></thead><tbody>${ranks.map(c=>`<tr><td><input type="checkbox" data-compare-id="${c.id}" aria-label="Compare ${E(c.name)}" ${p.discovery.compare.includes(c.id)?'checked':''}></td><td><button class="table-link" data-action="focus-channel" data-id="${c.id}">${E(c.name)}</button><p>${c.hours} h/week planning allowance</p></td><td>${badge(c.relevance,c.relevance==='Low'?'neutral':'fit')}</td><td>${badge(c.readiness,c.eligible?'neutral':'hypothesis')}</td><td><button class="table-link" data-action="availability" data-id="${c.id}">${E(c.availability.status==='unknown'?'Check availability':c.availability.status)}</button></td><td>${c.evidence.sources}</td></tr>`).join('')||'<tr><td colspan="6">No channels match these filters. Change the filters to see other routes.</td></tr>'}</tbody></table></div><div class="section-heading" id="channel-comparison"><h2>Channel comparison</h2><span>Relevance never overrides a feasibility constraint</span></div><div class="channel-card-grid">${compared.map(c=>`<section class="research-panel channel-card"><h2>${E(c.name)}</h2><div class="tag-row">${badge(c.relevance+' relevance','fit')}${badge(c.readiness,c.eligible?'neutral':'hypothesis')}</div><h3>Why investigate this route?</h3><p>${E(c.reason)}</p><div class="rubric">${c.breakdown.map(b=>`<details><summary>${b.name}<span>${b.value}/2</span></summary><p>${E(b.reason)}</p></details>`).join('')}</div><p class="small">Internal rubric: ${c.relevanceScore}/6${c.adjustment?` · source-checked adjustment ${c.adjustment>0?'+':''}${c.adjustment}`:''}. This is not a probability, reach estimate, or measured audience affinity.</p><h3>Can you execute it?</h3>${c.blockers.length?`<div class="constraint-note"><strong>Prepare first</strong>${list(c.blockers)}</div>`:''}${c.gaps.length?list(c.gaps):'<p>Reported prerequisites are present. Run a small test before scaling.</p>'}<p><strong>Geographic check:</strong> ${E(c.availability.note)}</p>${button('Record availability check','availability',false,'',`data-id="${c.id}"`)}<h3>First action</h3><p>${E(c.first)}</p><h3>What could make it fail?</h3><p>${E(c.risk)}</p><div class="button-row">${button(c.eligible?'Configure channel test':'Review prerequisites',c.eligible?'channel-test':'channel-constraints',c.eligible,'',`data-id="${c.id}"`)}${button('Link evidence','review-evidence',false,'',`data-channel="${c.id}"`)}</div></section>`).join('')}</div>`+boundary();}
function reviewList(){const rows=project().discovery.reviews;if(!rows.length)return empty('No research findings linked yet','Record a finding with its source, or keep an assumption explicitly unverified. This is optional for initial analysis.',button('Add research finding','review-evidence',true,'plus'),'file');return `<div class="review-list">${rows.map(r=>{const state=S.reviewState(project(),r),s=S.discover(project()).segments.find(x=>x.id===r.segmentId);return `<article class="research-panel"><div class="review-heading"><div>${badge(!state.valid?'Stale link':r.verification==='checked'?'Source-checked by you':r.verification==='assumption'?'User assumption':'User-reported observation',!state.valid?'hypothesis':r.verification==='checked'?'checked':'neutral')}${badge(r.stance)}${badge(s?.name||r.segmentId)}</div>${button('Review finding','edit-evidence',false,'edit',`data-id="${E(r.id)}"`)}</div><p>${E(r.statement)}</p><p class="small"><strong>Source:</strong> ${E(state.label)}${r.reference?' · '+E(r.reference):''}</p>${r.verification==='checked'?`<p class="small"><strong>Checked ${E(r.checkedAt)}:</strong> ${E(r.verificationNote)}</p>`:''}${state.response?`<details><summary>Read original response</summary>${['needs','painPoints','interests','motivation','notes'].filter(k=>state.response[k]).map(k=>`<blockquote class="quote"><strong>${S.LABELS[k]}</strong><p>${E(state.response[k])}</p></blockquote>`).join('')}<p>Channels: ${E(state.response.channels.join(', ')||'Not answered')}</p></details>`:''}</article>`;}).join('')}</div>`;}
function evidenceView(){const counts=evidenceCounts(),mode=ctx.getEvidenceTab();return header('Research evidence','Use source checks to separate observed findings from assumptions. Imports and surveys remain optional.',button('Add research finding','review-evidence',true,'plus'))+sample()+`<div class="evidence-summary"><div><strong>${counts.checked}</strong><span>source-checked identifiers</span></div><div><strong>${counts.reported}</strong><span>user-reported links</span></div><div><strong>${counts.assumptions}</strong><span>explicit assumptions</span></div><div><strong>${project().responses.length}</strong><span>original responses</span></div></div><p class="small evidence-explainer">“Source-checked” means you inspected the source and documented the check. The app does not certify authenticity or market-wide conclusions. ${counts.stale} links need review.</p><div class="tabs evidence-tabs" role="tablist" aria-label="Research evidence">${[['reviews','Findings register'],['summary','Observed answers'],['responses','Responses ('+project().responses.length+')'],['planner','Survey & interview guide']].map(([id,label])=>`<button role="tab" aria-selected="${mode===id}" class="tab ${mode===id?'active':''}" data-action="evidence-tab" data-tab="${id}">${label}</button>`).join('')}</div>${mode==='reviews'?reviewList():mode==='responses'?ctx.responsesView():mode==='planner'?ctx.plannerView():base.evidenceSummary(S.analyze(project(),ctx.getEvidenceSegment()))}`;}

function methodHTML(){return `<div class="help-sections"><h3>What this tool can establish</h3><p>AudienceScout is an offline research workbench, not a live audience database. It creates candidate audiences and research plans from your brief, then helps you keep source-linked evidence and test outcomes. No audience behavior, market size, platform reach, ad prices or discovered sources are fabricated.</p><h3>1. Interpret product function before industry nouns</h3><p>Explicit concepts are extracted separately from the product, industry, customer and use cases. Negated phrases are excluded where recognized. Compound rules require a product function and a compatible offering or purchase model. Inventory tasks plus software select retail operators, even when the industry is fruit. A fruit offer sold directly to consumers selects shopping occasions. Fitness and budgeting functions use different jobs and information needs. Student and office contexts specialize the relevant profiles.</p><p>This is a limited English rule system, not general language understanding. It can miss phrasing or misunderstand complex negation. Read the interpretation, correct the brief, or select an override. Unmatched domains use your stated tasks and purchasing roles with a visible fallback warning.</p><h3>2. Form 3–5 purchase or use-case hypotheses</h3><p>Scenario priority starts from a documented order (10 minus its position). Each supporting contextual concept adds 8 internal ordering points. An unstated workplace-purchase expansion in a consumer fruit business deducts 16 points. Unstated capabilities are flagged as adjacent opportunities. The points only order research scenarios and are not displayed as market metrics. Buyer and end user are separate fields. All profile characteristics, source categories and draft queries remain hypotheses until checked.</p><h3>3. Separate relevance from execution</h3><table><thead><tr><th>Relevance dimension</th><th>Rule</th></tr></thead><tbody><tr><td>Job / information need</td><td>2 for a primary task route; 1 for a secondary route; 0 with no direct link.</td></tr><tr><td>Offer / format</td><td>2 for a primary task format; 1 for a secondary format; 0 without a direct scenario link.</td></tr><tr><td>Buyer / user alignment</td><td>2 if the route addresses the proposed purchase/use role; otherwise 0.</td></tr></tbody></table><p>High: 5–6 rubric points; Moderate: 3–4; Low: 0–2. These are internal judgments, not probabilities or observed affinities. Rows rank by relevance, then feasibility and name. Execution checks budget, time, existing assets, local sales scope and a dated geographic availability record. Constraints cannot increase relevance. Time allowances are planning proposals, not measured requirements.</p><h3>4. Handle evidence explicitly</h3><p>System hypotheses, user assumptions, reported observations and source-checked observations use distinct labels. Source-checked means the user supplied a reference, check note and date after inspecting the original. It is not independent verification by the app. Only current source-checked links influence v3 relevance: at least two supporting source identifiers with more support than challenge add one point; more challenge than support subtracts one. Conflicting labels on one identifier count as mixed. Duplicate identifiers count once; independence is not established.</p><p>Changed source answers or changed linked profile content invalidate evidence links. Changing geographic scope invalidates availability checks. Old v2 projects retain their previous rule behavior until you save the new brief. Earlier tests and reviews remain in history.</p><h3>5. Validate before scaling</h3><p>Start with the job and buyer decision, then the current goal: first purchase, repeat value or message understanding. Follow with channel access and attribution. Set minimum observations and a decision threshold before starting. The app locks started plans and calculates outcomes only from recorded counts. Meeting a rule is not statistical significance or proof of market demand.</p><h3>Interface reference</h3><p>The audience-first search, analysis tabs, ranked research surfaces and research-to-action flow were informed by <a href="https://sparktoro.com/" target="_blank" rel="noopener noreferrer">SparkToro’s public product pages</a>. AudienceScout has original branding and uses its own local rules; it does not include SparkToro data or its API.</p></div>`;}
return {...base,shell,dashboard,audience,setupView,profilesView:profileView,evidenceView,channelsView,insightsView,reportsView,methodHTML};
});
